# 스테이징 실행 구성. 이 폴더(deploy/)에서 실행하며 값은 같은 폴더의 .env에서 읽는다.
# DB는 서버에 이미 있는 MariaDB 컨테이너를 그 Docker 네트워크(DB_NETWORK)로 접속해 쓴다.
#   앱 실행:      docker compose up -d --build app
#   마이그레이션: docker compose run --rm tools
#   시드(가상):   docker compose run --rm -e ALLOW_SEED=true tools npx prisma db seed
name: lms-kdt-staging

x-common: &common
  env_file: .env
  environment:
    TZ: Asia/Seoul
    STORAGE_DIR: /data/storage
  volumes:
    - ${STORAGE_HOST_DIR:-./storage}:/data/storage
  networks:
    - db

services:
  app:
    <<: *common
    build:
      context: ..
      target: runner
    image: lms-kdt:staging
    restart: unless-stopped
    # Nginx만 접근하도록 호스트 로컬에만 연다. 요청 제한이 메모리 방식이라 인스턴스는 하나만 둔다.
    ports:
      - "127.0.0.1:${APP_PORT:-3333}:3333"

  tools:
    <<: *common
    build:
      context: ..
      target: tools
    image: lms-kdt-tools:staging
    profiles: ["tools"]

networks:
  db:
    external: true
    name: ${DB_NETWORK:?deploy/.env에 기존 MariaDB 컨테이너의 네트워크 이름(DB_NETWORK)을 넣어 주세요}
